<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- viewport-fit=cover：刘海屏也铺满；user-scalable=no：手指操作时页面不会被缩放 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0c10">
    <title>Substrata</title>
    <meta name="description" content="Substrata —— 分层下落的 3D 方块解谜。沙会塌、水会流、火会烧，方块一层层往下掉。">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        /* 底色比游戏画面再深一点：万一画布边缘留了缝，缝里也是暗的，不会显出一条白边 */
        background: #0a0c10; overflow: hidden;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #unity-container {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      }
      #unity-canvas {
        display: block; width: 100%; height: 100%;
        background: #0a0c10; border: 0; outline: 0;
        /* 不让浏览器把拖动当成滚动/缩放，否则拖方块会连带页面动 */
        touch-action: none;
      }
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        display: none; width: 60%; max-width: 420px;
      }
      #unity-progress-bar-empty {
        width: 100%; height: 8px; border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
      }
      #unity-progress-bar-full {
        width: 0%; height: 100%; border-radius: 4px;
        background: #6bd0ff; transition: width 0.15s linear;
      }
      #unity-warning {
        position: absolute; left: 0; right: 0; top: 0;
        color: #fff; font: 14px/1.5 sans-serif; z-index: 10;
      }
      #mt-debug {
        position: fixed; left: 4px; bottom: 4px; z-index: 99;
        color: #6bd0ff; font: 12px/1.4 monospace; white-space: pre;
        pointer-events: none; display: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <div id="mt-debug"></div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var debugBox = document.querySelector("#mt-debug");

      // ── 画布尺寸同步 ────────────────────────────────────────────────
      // Unity 的 WebGL 运行时不会自己盯窗口尺寸：framework 里所有「屏幕多大」的
      // 判断都来自 canvas 的 width/height 属性（emscripten_get_canvas_element_size
      // 直接读它），而框架和 loader 都没有挂 resize 监听 —— 只改 CSS 尺寸、
      // 或者派发一次 resize 事件，Unity 都察觉不到，版式不会跟着切。
      // 所以窗口变化、屏幕旋转、进出全屏之后，必须由我们把这层 CSS 尺寸按 DPR
      // 折算写回 canvas.width/height，Unity 才会认为屏幕尺寸变了。
      // 注意：绝不能用 transform: rotate 去「视觉转屏」—— 触摸坐标是按
      // getBoundingClientRect 算的，旋转之后每根手指的落点都会错位。
      var MT_DPR = Math.min(window.devicePixelRatio || 1, 2);

      // 调试用：?size=900x420 把容器钉成指定尺寸，方便在电脑上直接看横屏/竖屏版式。
      var MT_TEST = null;
      (function () {
        var m = /[?&]size=(\d+)x(\d+)/.exec(location.search);
        if (!m) return;
        MT_TEST = [parseInt(m[1], 10), parseInt(m[2], 10)];
        container.style.width = MT_TEST[0] + 'px';
        container.style.height = MT_TEST[1] + 'px';
        container.style.left = '50%';
        container.style.top = '50%';
        container.style.right = 'auto';
        container.style.bottom = 'auto';
        container.style.transform = 'translate(-50%, -50%)';
      })();

      var MT_DEBUG = /[?&]debug=1/.test(location.search);
      if (MT_DEBUG) debugBox.style.display = 'block';

      // 目标画布比例：横 16:9 / 竖 9:16，auto 返回 0（铺满容器）。
      function mtTargetRatio() {
        var m = mtGetOrientation();
        return m === 'landscape' ? 16 / 9 : m === 'portrait' ? 9 / 16 : 0;
      }

      function mtSyncCanvas() {
        var boxW = container.clientWidth;
        var boxH = container.clientHeight;
        var ratio = mtTargetRatio();
        var cssW = boxW;
        var cssH = boxH;

        if (ratio > 0) {
          // 系统锁不了方向时（iOS Safari、微信内置浏览器、桌面浏览器）的兜底：
          // 把画布按目标比例摆好、四周留黑边。Unity 只看画布尺寸，
          // 比例对了版式就跟着切 —— 设置里那个「横屏 / 竖屏」至少不再是一按没反应。
          var w = boxW;
          var h = boxW / ratio;
          if (h > boxH) { h = boxH; w = boxH * ratio; }
          cssW = Math.max(1, Math.round(w));
          cssH = Math.max(1, Math.round(h));
          canvas.style.position = 'absolute';
          canvas.style.width = cssW + 'px';
          canvas.style.height = cssH + 'px';
          canvas.style.left = Math.round((boxW - cssW) * 0.5) + 'px';
          canvas.style.top = Math.round((boxH - cssH) * 0.5) + 'px';
        } else {
          canvas.style.position = '';
          canvas.style.width = '';
          canvas.style.height = '';
          canvas.style.left = '';
          canvas.style.top = '';
        }

        var w = Math.max(1, Math.round(cssW * MT_DPR));
        var h = Math.max(1, Math.round(cssH * MT_DPR));
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
        if (MT_DEBUG) {
          debugBox.textContent = 'css ' + cssW + 'x' + cssH
            + '  buffer ' + canvas.width + 'x' + canvas.height
            + '  dpr ' + MT_DPR;
        }
      }

      // 自测用：?alt=900x420&at=8 —— 加载 8 秒后把容器换成这个尺寸，
      // 模拟「转屏」这一步，用来验证 Unity 会不会跟着重排版式。
      function mtResizeTo(w, h) {
        container.style.width = w + 'px';
        container.style.height = h + 'px';
        container.style.left = '50%';
        container.style.top = '50%';
        container.style.right = 'auto';
        container.style.bottom = 'auto';
        container.style.transform = 'translate(-50%, -50%)';
        mtSyncCanvas();
      }
      (function () {
        var m = /[?&]alt=(\d+)x(\d+)/.exec(location.search);
        if (!m) return;
        var at = /[?&]at=([\d.]+)/.exec(location.search);
        var delay = at ? parseFloat(at[1]) * 1000 : 8000;
        // 等 Unity 真的起来之后再计时（?at 是从「可以玩了」开始算的秒数）
        var wait = setInterval(function () {
          if (!window.__unity) return;
          clearInterval(wait);
          setTimeout(function () {
            mtResizeTo(parseInt(m[1], 10), parseInt(m[2], 10));
            setTimeout(mtSyncCanvas, 200);
          }, delay);
        }, 100);
      })();

      // ── 屏幕方向 ────────────────────────────────────────────────────
      // 存储放 localStorage（Unity 的 PlayerPrefs 在 WebGL 下走 IndexedDB，读不到这么早），
      // 两边各存一份：Unity 启动后会把自己的值再推过来一次。
      var MT_ORIENT_KEY = 'mt.orientation';

      function mtGetOrientation() {
        try { return localStorage.getItem(MT_ORIENT_KEY) || 'auto'; } catch (e) { return 'auto'; }
      }

      // 调试用：?orient=landscape|portrait|auto 直接指定，优先于存档
      (function () {
        var m = /[?&]orient=(landscape|portrait|auto)/.exec(location.search);
        if (!m) return;
        try { localStorage.setItem(MT_ORIENT_KEY, m[1]); } catch (e) {}
      })();

      function mtCanLock() {
        if (!(screen.orientation && screen.orientation.lock && document.fullscreenEnabled))
          return false;
        // 桌面浏览器别去抢全屏：电脑上的窗口比例自己拉就行，而且桌面 Chrome
        // 根本不给网页锁方向，进了全屏也只是白闪一下。
        var touch = navigator.maxTouchPoints > 0 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        return touch;
      }

      // 真正把屏幕转过去：只能靠系统的方向锁，而且必须全屏、必须在用户手势里调。
      // 安卓 Chrome / Edge 支持；iOS Safari（含 iOS 上的微信）没有这个 API，
      // 微信 / QQ 内置 WebView 多数会吞掉调用 —— 这些环境只能靠玩家自己把手机横过来，
      // 由 C# 那边弹「请横屏握持」提示。
      function mtLockOrientation(mode) {
        if (!mtCanLock()) return;
        if (mode === 'auto') {
          try { screen.orientation.unlock(); } catch (e) { /* 忽略 */ }
          return;
        }
        var want = mode === 'landscape' ? 'landscape' : 'portrait';
        var entered = false;

        // lock 失败就退出全屏：桌面 Chrome 有 lock 这个方法但不认（reject），
        // 进了全屏又转不动的话，画面无缘无故变全屏会很奇怪。
        var backOut = function () {
          if (entered && document.fullscreenElement && document.exitFullscreen)
            try { document.exitFullscreen(); } catch (e) { /* 忽略 */ }
        };

        var lock = function () {
          var p = null;
          try { p = screen.orientation.lock(want); } catch (e) { backOut(); return; }
          if (p && p.then) p.then(function () { }).catch(backOut);
          else if (!p) backOut();
        };

        if (document.fullscreenElement) { lock(); return; }
        var rp = document.documentElement.requestFullscreen
          ? document.documentElement.requestFullscreen() : null;
        if (rp && rp.then) {
          entered = true;
          rp.then(lock).catch(function () { entered = false; });
        } else {
          lock();
        }
      }

      function mtSetOrientation(mode) {
        try { localStorage.setItem(MT_ORIENT_KEY, mode); } catch (e) { /* 无痕模式下写不进去，忽略 */ }
        mtLockOrientation(mode);
        mtSyncCanvas();
      }

      window.mtSetOrientation = mtSetOrientation;
      window.mtSyncCanvas = mtSyncCanvas;

      // 窗口变了、屏幕转了、全屏进出了 —— 三种都重新量一次。
      // orientationchange 之后 innerWidth/innerHeight 不一定立刻更新，补两个延时。
      window.addEventListener('resize', mtSyncCanvas);
      window.addEventListener('orientationchange', function () {
        mtSyncCanvas();
        setTimeout(mtSyncCanvas, 100);
        setTimeout(mtSyncCanvas, 300);
      });
      document.addEventListener('fullscreenchange', function () {
        setTimeout(mtSyncCanvas, 60);
        setTimeout(mtSyncCanvas, 300);
      });

      // 低频心跳：Unity 启动 / 切场景时会按 canvas 标签上的默认尺寸再设一次画布，
      // 那一下会把我们提前写好的尺寸盖掉（实测开局按 960×600 排版、右侧按钮被切掉）。
      // 尺寸一致时这里什么也不做，代价只有一次比较。
      setInterval(mtSyncCanvas, 1000);

      function unityShowBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.style.padding = '10px';
        if (type == 'error') div.style.background = '#8b1a1a';
        else if (type == 'warning') div.style.background = '#8a6d12';
        else div.style.background = 'rgba(0,0,0,0.6)';
        warningBanner.appendChild(div);
        if (type != 'error') {
          setTimeout(function () {
            if (div.parentNode) div.parentNode.removeChild(div);
          }, 5000);
        }
      }

      // 手机浏览器上自动把 mobile=1 补进网址：Unity 里判断「要不要挂触屏操作层」
      // 会读 Application.absoluteURL，靠这个参数兜底，省得用户手打。
      // 用 replaceState 改地址不会刷新页面，Unity 拿到的就是新地址。
      // mobile=0 是明确的「要桌面版式」，这时候不要再往地址里补 mobile=1
      var wantDesktop = location.search.indexOf('mobile=0') >= 0;
      if (!wantDesktop
          && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
          && location.search.indexOf('mobile=1') < 0) {
        try {
          history.replaceState(null, '', location.pathname + '?mobile=1' + (location.hash || ''));
        } catch (e) { /* 某些内嵌浏览器不让改，忽略即可 */ }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BuildWebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/BuildWebGL.data",
        frameworkUrl: buildUrl + "/BuildWebGL.framework.js",
        codeUrl: buildUrl + "/BuildWebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "monody",
        productName: "Substrata",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // 高分屏手机是 3 倍甚至 4 倍像素密度，照原样渲染等于让 GPU 干三倍的活。
      // 封在 2 倍：肉眼看不出区别，帧数能稳住。
      // 这个值必须和 MT_DPR 完全一致：Unity 用「画布像素 ÷ 这个比例」换算 Screen，
      // 两边差一个倍数的话，版式会按错误的宽度排（真机上表现为整体缩一半/超一截）。
      config.devicePixelRatio = MT_DPR;

      // 存档（PlayerPrefs）落到 IndexedDB 时自动同步，刷新页面还接着上一局
      config.autoSyncPersistentDataPath = true;

      // 建实例之前先把画布尺寸写对，Unity 初始化时量的就是最终尺寸，
      // 免得开局先按模板里的初始尺寸排一遍版式再跳一下。
      mtSyncCanvas();
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          window.__unity = unityInstance;
          // Unity 起来时可能已经改过画布尺寸，再量一遍保险
          mtSyncCanvas();
          setTimeout(mtSyncCanvas, 100);
          setTimeout(mtSyncCanvas, 600);
          // 这里原来挂了一个「第一次点画面就自动全屏」，目的是把手机浏览器的地址栏
          // 收掉、多挤出一点高度。实际用下来很烦：每进一次网页，第一下不管是想点
          // 「开始」还是想拖方块，都先被切成全屏，画面还会重排一次。
          // 现在不自动抢全屏了，要全屏让玩家自己用浏览器的功能。
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
